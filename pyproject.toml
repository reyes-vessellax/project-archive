[project]
name = "project-archive"
version = "0.4.4"
description = "DJ audio preflight: stage a track, inspect its real format and spectrum, then keep or reject it."
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0", "numpy>=2.1", "keyring>=25"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
project-archive = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
