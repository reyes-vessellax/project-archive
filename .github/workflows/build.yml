name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

  windows-app:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch FFmpeg to bundle
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          Copy-Item "$bin/ffmpeg.exe","$bin/ffprobe.exe" vendor/ffmpeg/
          $lic = Get-ChildItem ffmpeg-dl -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName vendor/ffmpeg/FFMPEG-LICENSE.txt }
      - name: Fetch the Soulseek engine (slskd) to bundle
        shell: pwsh
        env:
          SLSKD_VERSION: "0.26.2"
        run: |
          Invoke-WebRequest -Uri "https://github.com/slskd/slskd/releases/download/$env:SLSKD_VERSION/slskd-$env:SLSKD_VERSION-win-x64.zip" -OutFile slskd.zip
          New-Item -ItemType Directory -Force vendor/slskd | Out-Null
          Expand-Archive slskd.zip -DestinationPath vendor/slskd
          if (-not (Test-Path vendor/slskd/slskd.exe)) { throw "slskd.exe not found after extraction" }
          # Prompts show the executable's path, and users don't know what slskd is, so ship it under our name.
          # (Its embedded description can't be edited: it is a .NET single-file bundle and resource editors
          # corrupt it. The installer will add a named firewall rule instead; see docs/DECISIONS_AND_FLAGS.md.)
          $name = (python -c "from app.config import APP_NAME; print(APP_NAME)")
          Move-Item vendor/slskd/slskd.exe "vendor/slskd/$name Engine.exe"
          if (-not (Test-Path "vendor/slskd/$name Engine.exe")) { throw "engine rename failed" }
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python packaging/build.py
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (python -c "from app.config import APP_VERSION; print(APP_VERSION)")
          "version=$v" >> $env:GITHUB_OUTPUT
          $s = (python -c "from app.config import APP_SLUG; print(APP_SLUG)")
          "slug=$s" >> $env:GITHUB_OUTPUT
          $n = (python -c "from app.config import APP_NAME; print(APP_NAME)")
          "name=$n" >> $env:GITHUB_OUTPUT
      - name: Smoke test the built app
        shell: pwsh
        run: |
          $name = (python -c "from app.config import APP_NAME; print(APP_NAME)")
          $p = Start-Process -FilePath "dist/$name/$name.exe" -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path "dist/$name/self-test.log") { Get-Content "dist/$name/self-test.log"; Remove-Item "dist/$name/self-test.log" }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.slug }}-${{ steps.ver.outputs.version }}-Windows
          path: dist/${{ steps.ver.outputs.name }}/
          retention-days: 30

  macos-app:
    needs: test
    runs-on: macos-latest          # Apple Silicon runner; the app is arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch FFmpeg to bundle (static arm64)
        run: |
          set -e
          mkdir -p vendor/ffmpeg dl && cd dl
          curl -fsSL -o ffmpeg.zip  "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          curl -fsSL -o ffprobe.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip"
          unzip -o -q ffmpeg.zip && unzip -o -q ffprobe.zip
          cp ffmpeg ffprobe ../vendor/ffmpeg/ && chmod +x ../vendor/ffmpeg/ffmpeg ../vendor/ffmpeg/ffprobe
          ../vendor/ffmpeg/ffmpeg -version | head -1
          curl -fsSL -o ../vendor/ffmpeg/FFMPEG-LICENSE.txt "https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/COPYING.GPLv3" || true
      - name: Fetch the Soulseek engine (slskd) to bundle
        env:
          SLSKD_VERSION: "0.26.2"
        run: |
          set -e
          mkdir -p vendor/slskd
          curl -fsSL -o slskd.zip "https://github.com/slskd/slskd/releases/download/${SLSKD_VERSION}/slskd-${SLSKD_VERSION}-osx-arm64.zip"
          unzip -o -q slskd.zip -d vendor/slskd
          test -f vendor/slskd/slskd || { echo "slskd binary not found"; ls -R vendor/slskd; exit 1; }
          name=$(python -c "from app.config import APP_NAME; print(APP_NAME)")
          mv vendor/slskd/slskd "vendor/slskd/$name Engine" && chmod +x "vendor/slskd/$name Engine"
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python packaging/build.py
      - name: Sign ad hoc (lets Apple Silicon run it; first open is right-click → Open)
        run: |
          name=$(python -c "from app.config import APP_NAME; print(APP_NAME)")
          codesign --force --deep --sign - "dist/$name.app"
          codesign --verify --deep --strict "dist/$name.app" && echo "signed (ad hoc)"
      - name: Read version
        id: ver
        run: |
          echo "version=$(python -c 'from app.config import APP_VERSION; print(APP_VERSION)')" >> $GITHUB_OUTPUT
          echo "slug=$(python -c 'from app.config import APP_SLUG; print(APP_SLUG)')" >> $GITHUB_OUTPUT
          echo "name=$(python -c 'from app.config import APP_NAME; print(APP_NAME)')" >> $GITHUB_OUTPUT
      - name: Smoke test the built app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          name="${{ steps.ver.outputs.name }}"
          "dist/$name.app/Contents/MacOS/$name" --self-test || code=$?
          cat self-test.log 2>/dev/null || cat "dist/$name.app/Contents/MacOS/self-test.log" 2>/dev/null || true
          exit ${code:-0}
      - name: Make the disk image (drag to Applications)
        run: |
          set -e
          name="${{ steps.ver.outputs.name }}"; slug="${{ steps.ver.outputs.slug }}"; ver="${{ steps.ver.outputs.version }}"
          rm -rf dmg-stage && mkdir dmg-stage
          cp -R "dist/$name.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "$name" -srcfolder dmg-stage -ov -format UDZO "$slug-$ver-macOS.dmg"
          ls -la "$slug-$ver-macOS.dmg"
      - name: Prove the image mounts and the app inside runs
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          name="${{ steps.ver.outputs.name }}"; slug="${{ steps.ver.outputs.slug }}"; ver="${{ steps.ver.outputs.version }}"
          mnt=$(hdiutil attach -nobrowse -readonly "$slug-$ver-macOS.dmg" | tail -1 | awk '{print $NF}')
          echo "mounted at $mnt"; ls "$mnt"
          # copy out like a user dragging to Applications, then run the self-test from the copy
          rm -rf appcopy && mkdir appcopy && cp -R "$mnt/$name.app" appcopy/
          hdiutil detach "$mnt"
          codesign --verify --deep --strict "appcopy/$name.app" && echo "copy still signed"
          "appcopy/$name.app/Contents/MacOS/$name" --self-test || code=$?
          cat "appcopy/$name.app/Contents/MacOS/self-test.log" 2>/dev/null || cat self-test.log 2>/dev/null || true
          exit ${code:-0}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.slug }}-${{ steps.ver.outputs.version }}-macOS
          path: ${{ steps.ver.outputs.slug }}-${{ steps.ver.outputs.version }}-macOS.dmg
          retention-days: 30
